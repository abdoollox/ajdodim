<title>Ajdodim · Rahmonqul hoji ota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Philosopher:wght@400;700&display=swap">
<style>
/* Layout: kitob muqovasidek yashil sarlavha; ostida uch ko‘rinish (daraxt, vaqt chizig‘i, ro‘yxat); o‘ngda yoki pastda ochiladigan kartochka */
:root {
  --bg: #E7ECE6;
  --band: #DCE4DB;
  --surface: #FAFBF7;
  --ink: #14251D;
  --muted: #59695F;
  --line: #B9C7BC;
  --cover: #173A2C;
  --cover-2: #1E4836;
  --cover-ink: #F2EAD3;
  --gold: #9C7520;
  --gold-bright: #D9B45A;
  --gold-soft: #EFE3BF;
  --accent: #14707A;
  --accent-soft: #D2E8E8;
  --hl: #C8962A;
  --danger: #A63A2B;
  --scrim: rgba(6, 14, 10, .9);
  --scrim-ink: #EDEFE9;
  --shadow: 0 1px 2px rgba(20, 37, 29, .10), 0 6px 18px rgba(20, 37, 29, .07);
  --f-display: "Philosopher", "Georgia", serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1712; --band: #111F18; --surface: #16251E; --ink: #E3EBE4; --muted: #92A598; --line: #2E4539;
    --cover: #0F271D; --cover-2: #143226; --cover-ink: #F0E4C2; --gold: #D4B062; --gold-bright: #E2C273; --gold-soft: #3A3220;
    --accent: #5BBAC2; --accent-soft: #163739; --hl: #E2B755; --danger: #E57A69;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1712; --band: #111F18; --surface: #16251E; --ink: #E3EBE4; --muted: #92A598; --line: #2E4539;
  --cover: #0F271D; --cover-2: #143226; --cover-ink: #F0E4C2; --gold: #D4B062; --gold-bright: #E2C273; --gold-soft: #3A3220;
  --accent: #5BBAC2; --accent-soft: #163739; --hl: #E2B755; --danger: #E57A69;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Sarlavha ---------- */
.top {
  background: var(--cover); color: var(--cover-ink); position: relative; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
}
.top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
  background:
    linear-gradient(135deg, var(--gold-bright) 25%, transparent 25%) 0 0 / 12px 6px,
    linear-gradient(225deg, var(--gold-bright) 25%, transparent 25%) 0 0 / 12px 6px,
    var(--cover);
  opacity: .9;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 300px; }
/* Logotip joyi: 1:1 o‘lchamli SVG yoki PNG shu blok ichiga qo‘yiladi */
.logo { flex: none; width: 44px; height: 44px; display: grid; place-items: center; }
.logo svg, .logo img { width: 100%; height: 100%; display: block; }
.product { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; color: var(--cover-ink); white-space: nowrap; }
.product b { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
.product span { font-size: 11.5px; opacity: .6; }
.brand h1 {
  font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; margin: 0;
  color: var(--gold-bright); letter-spacing: .01em; text-wrap: balance;
}
.brand .meta { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; font-size: 12.5px; margin-top: 3px; opacity: .88; font-variant-numeric: tabular-nums; }
.demo {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor;
  border-radius: 4px; padding: 1px 6px; color: var(--gold-bright);
}
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1 1 520px; justify-content: flex-end; }
.search { position: relative; flex: 1 1 200px; max-width: 300px; }
.search input {
  width: 100%; box-sizing: border-box; height: 38px; border-radius: 8px; border: 1px solid rgba(242, 234, 211, .25);
  background: var(--cover-2); color: var(--cover-ink); padding: 0 12px 0 34px; font: inherit;
}
.search input::placeholder { color: var(--cover-ink); opacity: .6; }
.search svg { position: absolute; left: 11px; top: 11px; opacity: .7; pointer-events: none; }
.qres {
  position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); list-style: none; margin: 0; padding: 4px;
  max-height: 320px; overflow: auto; z-index: 20;
}
.qres button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: grid; gap: 1px; }
.qres button:hover, .qres button.on { background: var(--accent-soft); }
.qres small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; background: var(--cover-2); border-radius: 8px; padding: 3px; border: 1px solid rgba(242, 234, 211, .18); }
.seg button { border: 0; background: none; color: var(--cover-ink); height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer; opacity: .8; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--cover-ink); color: var(--cover); opacity: 1; font-weight: 600; }
.btn-gold {
  height: 38px; padding: 0 14px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 600;
  background: var(--gold-bright); color: #1B2A20; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn-gold:hover { filter: brightness(1.06); }
.icobtn {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(242, 234, 211, .25); background: var(--cover-2);
  color: var(--cover-ink); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0;
}
.icobtn:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
.icobtn .ex { display: none; }
.icobtn[aria-pressed="true"] .en { display: none; }
.icobtn[aria-pressed="true"] .ex { display: block; }

.fbtn { position: relative; }
.fbtn.on { border-color: var(--gold-bright); color: var(--gold-bright); }
.fbadge {
  position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box;
  background: var(--gold-bright); color: #1B2A20; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.fstrip {
  display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-block: 12px 8px; background: var(--surface);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); font-size: 13px;
}
.fslbl { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.fpill { border: 1px solid var(--gold); background: var(--gold-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.fpill span { color: var(--gold); font-weight: 700; margin-left: 2px; }
.fpill:hover { border-color: var(--danger); }
.fsn { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.fslink { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
.fpanel {
  position: absolute; z-index: 7; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
  top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; width: 330px; border-radius: 14px; border: 1px solid var(--line);
}
.fsec h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.fhint { margin: -4px 0 8px; font-size: 12px; color: var(--muted); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.fchips button small { color: var(--muted); margin-left: 2px; }
.fchips button:hover { border-color: var(--accent); }
.fchips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.fchips button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.frange { display: flex; gap: 8px; align-items: end; }
.frange label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
.frange input, .fsec select {
  height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 14px; padding: 0 10px; box-sizing: border-box; width: 100%; min-width: 0;
}
.frange span { padding-bottom: 10px; color: var(--muted); }
.fchk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 0; cursor: pointer; }
.ffoot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); }
.ffoot span { margin-right: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fempty { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 24px 0; }
.filtermode .card:not(.fm) { opacity: .22; }
.filtermode .card.fm { border-color: var(--accent); }
.filtermode .card.fmsp { opacity: .7; }
.filtermode .card.fmsp .sp { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.filtermode .kinlbl, .filtermode .glbl, .filtermode .tg { opacity: .4; }

/* ---------- Asosiy maydon ---------- */
main { position: relative; flex: 1; min-height: 0; }
#stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
#stage:active { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#links { position: absolute; left: 0; top: 0; overflow: visible; }
.bandrect { fill: var(--band); }
.link { fill: none; stroke: var(--line); stroke-width: 1.5; }
.link.hl { stroke: var(--hl); stroke-width: 3; }

.av {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-weight: 600; font-size: 13px; letter-spacing: .02em; background-size: cover; background-position: center 30%;
}
.av.m { background-color: var(--accent-soft); color: var(--accent); }
.av.f { background-color: var(--gold-soft); color: var(--gold); }
.av.ph { color: transparent; box-shadow: inset 0 0 0 1px var(--line); }

.card {
  position: absolute; width: 184px; height: 96px; box-sizing: border-box;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  display: grid; grid-template-rows: 1fr 24px; overflow: hidden;
  transition: opacity .25s, border-color .2s, box-shadow .2s;
}
.card .main {
  border: 0; background: none; cursor: pointer; text-align: left; padding: 9px 10px 6px;
  display: grid; grid-template-columns: 34px 1fr; column-gap: 9px; align-items: start; min-width: 0;
}
.card .main .av { grid-row: span 3; }
.card .main:hover { background: var(--accent-soft); }
.card .nm { font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .yr { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; display: flex; gap: 6px; align-items: center; }
.card .jb { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.cam { display: inline-flex; align-items: center; gap: 2px; color: var(--gold); font-weight: 600; font-size: 11px; }
.card .sp {
  border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; text-align: left; white-space: nowrap; overflow: hidden;
}
.card .sp:hover { color: var(--ink); background: var(--accent-soft); }
.card .sp svg { flex: none; color: var(--gold); }
.card .sp span { overflow: hidden; text-overflow: ellipsis; }
.card .sp.none { cursor: default; }
.card.root { border: 2px solid var(--gold); }
.card.root .nm { font-family: var(--f-display); font-size: 15px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.card.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px var(--hl); } 100% { box-shadow: var(--shadow); } }
.relmode .card { opacity: .28; }
.relmode .card.hl { opacity: 1; border-color: var(--hl); }
.relmode .card.end { box-shadow: 0 0 0 3px var(--hl), var(--shadow); }
.card .sp.end { color: var(--ink); font-weight: 600; background: var(--gold-soft); }
.link.kin { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 5; }
.link.kin.hl { stroke: var(--hl); stroke-width: 3.5; }
.kinlbl {
  position: absolute; transform: translate(-50%, -50%); z-index: 2; border: 1px solid var(--gold); background: var(--gold-soft);
  color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; transition: opacity .25s;
}
.kinlbl svg { color: var(--gold); }
.relmode .kinlbl { opacity: .35; }
.relmode .kinlbl.hl { opacity: 1; }
.card .sp.kin { color: var(--gold); font-weight: 600; }
.card .sp.multi { display: flex; gap: 2px; padding: 0 6px 0 10px; cursor: default; }
.card .sp.multi button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card .sp.multi button:hover { background: var(--accent-soft); color: var(--ink); }
.card .sp.multi button.was { font-style: italic; opacity: .75; }
.card .sp.multi button.end { background: var(--gold-soft); color: var(--ink); font-weight: 600; }
.glbl {
  position: absolute; transform: translate(-50%, -50%); z-index: 1; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; cursor: pointer; white-space: nowrap; transition: opacity .25s;
}
.glbl:hover { color: var(--ink); border-color: var(--accent); }
.glbl.was { border-style: dashed; }
.relmode .glbl { opacity: .3; }
.mars { display: grid; gap: 8px; }
.mar { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
.marh { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.marh .ord { width: 20px; height: 20px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: 11px; display: grid; place-items: center; }
.mwhen { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mst { font-size: 11px; border-radius: 4px; padding: 1px 6px; font-weight: 600; letter-spacing: .02em; }
.mst.div { color: var(--danger); border: 1px solid var(--danger); }
.mst.dead { background: var(--band); color: var(--ink); }
.mst.now { background: var(--accent-soft); color: var(--accent); }
.mkids { padding-left: 10px; border-left: 2px solid var(--band); margin-left: 9px; }
.kinbox { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.kinbox b { display: flex; gap: 6px; align-items: center; color: var(--gold); font-size: 13px; }
.kinbox p { margin: 0; line-height: 1.55; font-size: 13.5px; }
.kinbox .btn { justify-self: start; }
.routes { display: grid; gap: 6px; }
.route {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline;
}
.route b { font-weight: 600; }
.route small { grid-column: 2; color: var(--muted); font-size: 12px; }
.route .kind { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; border-radius: 4px; padding: 1px 6px; grid-row: span 2; align-self: center; }
.route .kind.qon { background: var(--accent-soft); color: var(--accent); }
.route .kind.nikoh { background: var(--gold-soft); color: var(--gold); }
.route.on { border-color: var(--hl); box-shadow: 0 0 0 2px var(--gold-soft); }
.tg {
  position: absolute; width: 30px; height: 22px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0;
  font-variant-numeric: tabular-nums; transition: opacity .25s;
}
.tg.closed { width: auto; padding: 0 8px; background: var(--accent); color: var(--surface); border-color: var(--accent); }
.relmode .tg { opacity: .3; }

#rail { position: absolute; left: 0; top: 0; bottom: 0; width: 0; pointer-events: none; }
.gen {
  position: absolute; transform: translateY(-50%); left: env(safe-area-inset-left, 0px);
  font-family: var(--f-display); color: var(--gold); white-space: nowrap; line-height: 1.1;
  background: var(--surface); border: 1px solid var(--line); border-left: 0; box-shadow: var(--shadow);
  padding: 4px 10px 5px 8px; border-radius: 0 8px 8px 0;
}
.gen b { font-size: 20px; display: block; }
.gen small { font-family: var(--f-body); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.zoom {
  position: absolute; right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; gap: 6px; z-index: 3;
}
.zoom button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow); cursor: pointer; font-size: 18px; display: grid; place-items: center; color: var(--ink);
}
.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
  font-size: 12.5px; color: var(--muted); max-width: min(360px, calc(100% - 100px)); transition: opacity .4s;
}
.hint b { color: var(--ink); font-weight: 600; }

/* ---------- Vaqt chizig‘i (Gantt) ---------- */
#timeline { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tbar {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.tbar .grp { display: flex; gap: 6px; align-items: center; }
.tbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; }
.pseg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.pseg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); }
.pseg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.sq { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-left: auto; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 4px; }
.lg-b { background: var(--accent); }
.lg-s { background: var(--gold-soft); border: 1px solid var(--gold); box-sizing: border-box; }
.lg-p { width: 9px !important; height: 9px !important; border-radius: 50% !important; background: var(--hl); }
.gwrap { flex: 1; overflow: auto; position: relative; min-height: 0; overscroll-behavior: contain; }
.ginner { position: relative; }
.gaxis { position: sticky; top: 0; z-index: 4; display: flex; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); }
.gcorner {
  position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); flex: none;
  display: flex; align-items: flex-end; padding: 0 10px 8px max(10px, env(safe-area-inset-left, 0px)); box-sizing: border-box;
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.gticks { position: relative; flex: none; }

/* Namuna rasmlar uchun davrga mos (sepiya, oq-qora, rangi o‘chgan, rangli) siluet-suratlar chiziladi */
function samplePhotoSrc(ph) {

  const P = {
    sepia: { a: "#E6D3AC", b: "#8F6F45", g: "#8A6B43", f: ["#4A3520", "#5C4229", "#3B2A19"], frame: "#F0E5CC" },
    bw: { a: "#E4E4E0", b: "#77776F", g: "#8D8D87", f: ["#2A2A2A", "#3C3C3C", "#1F1F1F"], frame: "#F3F3EF" },
    faded: { a: "#C3D5D2", b: "#E5D8B4", g: "#A8A473", f: ["#5B5470", "#7C5049", "#4F6172"], frame: "#F2ECDD" },
    color: { a: "#86C1F0", b: "#DCEEFB", g: "#6AB36C", f: ["#2E5D8C", "#B5523F", "#D99A2B", "#4E7D4A"], frame: null },
  }[era];
  const out = ph.scene === "outdoor";
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">`;
  s += `<defs><linearGradient id="k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.a}"/><stop offset="1" stop-color="${P.b}"/></linearGradient>`;
  s += `<radialGradient id="v" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${era === "color" ? .12 : .38}"/></radialGradient></defs>`;
  if (out) {
    s += `<rect width="320" height="240" fill="url(#k)"/><rect y="168" width="320" height="72" fill="${P.g}"/>`;
    s += `<circle cx="40" cy="150" r="34" fill="${P.g}" opacity=".85"/><circle cx="282" cy="140" r="44" fill="${P.g}" opacity=".9"/><rect x="278" y="150" width="8" height="30" fill="${P.f[0]}" opacity=".6"/>`;
  } else {
    s += `<rect width="320" height="240" fill="${P.b}"/><ellipse cx="160" cy="110" rx="150" ry="120" fill="${P.a}" opacity=".9"/>`;
    s += `<path d="M0 0h26v240H0zM294 0h26v240h-26z" fill="${P.f[0]}" opacity=".25"/>`;
  }
  const figs = ph.people.map(id => { const p = get(id); const a = y - p.b; return a < 7 ? .55 : a < 14 ? .72 : 1; });
  for (let i = 0; i < ph.extra; i++) figs.push(.95);

    s += `<circle cx="${x}" cy="${top - 16 * sc}" r="${19 * sc}" fill="${c}"/>`;
  });

  try {

  d3.select(stage).transition().duration(dur).call(zoom.transform, t);
}

const F = { branch: null, gens: new Set(), status: "all", sex: "all", place: "", photo: false, spouses: true, from: null, to: null };

function matches(p) {
  if (!p.blood && !F.spouses) return false;
  const h = host(p);
  if (F.branch && !ancestry(h).has(F.branch)) return false;
  if (F.gens.size && !F.gens.has(p.depth)) return false;
  if (F.status === "alive" && p.d) return false;
  if (F.status === "dead" && !p.d) return false;
  if (F.sex !== "all" && p.sex !== F.sex) return false;
  if (F.place && !placesOf(p).includes(F.place)) return false;
  if (F.photo && !photosOf(p.id).length) return false;
  if (F.from != null && (p.d || NOW) < F.from) return false;
  if (F.to != null && p.b > F.to) return false;
  return true;
}
function filterParts() {

  if (F.status !== "all") parts.push([F.status === "alive" ? "Tiriklar" : "Vafot etganlar", "status"]);
  if (F.sex !== "all") parts.push([F.sex === "m" ? "Erkaklar" : "Ayollar", "sex"]);
  if (F.place) parts.push([F.place, "place"]);
  if (F.photo) parts.push(["Rasmi borlar", "photo"]);
  if (F.from != null || F.to != null) parts.push([`${F.from ?? "…"}–${F.to ?? "…"} yillarda yashaganlar`, "period"]);
  if (!F.spouses) parts.push(["Kelin-kuyovlarsiz", "spouses"]);

/* ===== Vaqt chizig‘i (Gantt) ===== */
const Y0 = 1860, Y1 = 2030;
const EVENTS = [
  { y: 1924, t: "O‘zSSR tuzildi" },
  { y: 1941, y2: 1945, t: "Urush yillari" },
  { y: 1966, t: "Toshkent zilzilasi" },
  { y: 1991, t: "Mustaqillik" },
];
const tl = { sort: "family", ppy: 0, cursorYear: null };
const gwrap = document.getElementById("gwrap");
const nameW = () => isNarrow() ? 132 : 220;

function timelineRows() {
  let rows = familyOrder(F.spouses).filter(matches);
  if (tl.sort === "birth") rows = [...rows].sort((a, b) => a.b - b.b);
  return rows;
}
function renderTimeline() {
  if (!tl.ppy) tl.ppy = Math.max(5, Math.min(12, (gwrap.clientWidth - nameW() - 24) / (Y1 - Y0)));
  const ppy = tl.ppy, NW = nameW(), W = Math.round((Y1 - Y0) * ppy);
  const X = y => (y - Y0) * ppy;
  const rows = timelineRows();
  const step = ppy < 6 ? 20 : 10;

  let ticks = "";
  for (let y = Y0; y <= Y1; y += 10) if ((y - Y0) % step === 0) ticks += `<span class="gtick${y % 50 === 0 ? " c" : ""}" style="left:${X(y)}px">${y}</span>`;
  ticks += EVENTS.map(e => `<span class="gev" style="left:${X(e.y)}px" title="${e.y}${e.y2 ? "–" + e.y2 : ""}: ${esc(e.t)}">${esc(e.t)}</span>`).join("");

  let layer = "";
  for (let y = Y0; y <= Y1; y += 10) layer += `<i class="gline${y % 50 === 0 ? " c" : ""}" style="left:${X(y)}px"></i>`;
  for (const e of EVENTS) layer += e.y2 ? `<i class="gwar" style="left:${X(e.y)}px;width:${X(e.y2) - X(e.y)}px"></i>` : `<i class="gevl" style="left:${X(e.y)}px"></i>`;
  layer += `<i class="gnow" style="left:${X(NOW)}px" title="Bugun, ${NOW}"></i>`;
  layer += `<div class="gcur" id="gcur" hidden><span id="gcurL"></span></div>`;

  const rowsHtml = rows.map(p => {
    const end = p.d || NOW, left = X(p.b), w = Math.max(6, X(end) - X(p.b));
    const label = `${p.b}–${p.d || ""} · ${p.d ? p.d - p.b : NOW - p.b + " yosh"}`;
    const inside = w > 118;
    const kids = p.blood ? allKids(p).map(k => `<i class="gkid" style="left:${X(k.b)}px" title="${esc(k.name)} tug‘ildi (${k.b})"></i>`).join("") : "";
    /* Nikoh: halqa belgisi va nikohda o‘tgan yillar ostidan oltin chiziq */
    const pms = marriagesOf(p.id);
    const mars = pms.filter(m => m.year).map((m, i) => {
      const s = partnerOf(m, p.id), e = marriageEnd(m), mEnd = e ? e.year : NOW;
      let tip = `${pms.length > 1 ? `${i + 1}-nikoh. ` : ""}${m.year}-yil: ${s.name} bilan turmush qurgan (${m.year - p.b} yoshida)${m.kin ? " · qarindoshlar nikohi" : ""}`;
      if (e && e.type === "div") tip += ` · ${e.year}-yilda ajrashgan`;
      else if (e && e.type === "death" && e.who === s.id) tip += ` · ${e.year}-yilda ${s.name} vafot etgan`;
      return `<i class="gmar${m.kin ? " kin" : ""}${e && e.type === "div" ? " div" : ""}" style="left:${X(m.year)}px;width:${Math.max(2, X(mEnd) - X(m.year))}px"></i>`
        + `<button class="gring${m.kin ? " kin" : ""}" data-go="${s.id}" style="left:${X(m.year)}px" title="${esc(tip)}" aria-label="${esc(tip)}">${RINGS}</button>`
        + (e && e.type === "div" ? `<i class="gdiv" style="left:${X(e.year)}px" title="${e.year}-yil: ${esc(s.name)} bilan ajrashgan"></i>` : "")
        + (e && e.type === "death" && e.who === s.id && e.year < (p.d || NOW) && pms.length > 1 ? `<i class="gwid" style="left:${X(e.year)}px" title="${e.year}-yil: ${esc(s.name)} vafot etgan, beva qolgan"></i>` : "");
    }).join("");
    const phs = photosOf(p.id).map(ph => `<button class="gph" data-photo="${ph.id}" data-ctx="${p.id}" style="left:${X(ph.year)}px" title="${esc(yearText(ph))}: ${esc(ph.caption || "Rasm")}" aria-label="Rasm, ${esc(yearText(ph))}"></button>`).join("");
    return `<div class="grow${p.blood ? "" : " in"}${selected === p.id ? " sel" : ""}" data-go="${p.id}" data-b="${p.b}" data-d="${end}">
      <div class="gname" style="width:${NW}px">${avatar(p)}<span class="t">${esc(full(p))}${p.blood ? "" : ` <small>· ${p.sex === "f" ? "kelin" : "kuyov"}</small>`}</span><span class="gn">${ROMAN[p.depth]}</span></div>
      <div class="gtrack" style="width:${W}px">
        <div class="gb${p.d ? "" : " alive"}" style="left:${left}px;width:${w}px">${inside ? esc(label) : `<span class="out">${esc(label)}</span>`}</div>
        ${kids}${mars}${phs}
      </div>
    </div>`;
  }).join("");

  gwrap.innerHTML = `<div class="ginner" id="ginner" style="width:${NW + W}px">
    <div class="gaxis"><div class="gcorner" style="width:${NW}px">${rows.length} kishi</div><div class="gticks" style="width:${W}px">${ticks}</div></div>
    <div class="gbody" id="gbody" style="position:relative">
      <div class="glayer" style="left:${NW}px;width:${W}px">${layer}</div>

}
function setCursor(year) {
  const cur = document.getElementById("gcur"), body = document.getElementById("gbody");
  if (!cur) return;
  if (year == null || year < Y0 || year > NOW) { cur.hidden = true; body.classList.remove("cursoron"); tl.cursorYear = null; return; }
  tl.cursorYear = year;
  cur.hidden = false;
  cur.style.left = `${(year - Y0) * tl.ppy}px`;
  let alive = 0;
  body.querySelectorAll(".grow").forEach(r => {
    const on = +r.dataset.b <= year && +r.dataset.d >= year;
    r.classList.toggle("dead", !on);
    if (on) alive++;
  });
  body.classList.add("cursoron");
  document.getElementById("gcurL").textContent = `${year}-yil · ${alive} kishi hayot`;
}
let curRaf = 0;
function cursorFromEvent(e) {
  const body = document.getElementById("gbody"); if (!body) return;
  const x = e.clientX - body.getBoundingClientRect().left - nameW();
  if (x < 0) { setCursor(null); return; }
  const y = Math.round(Y0 + x / tl.ppy);
  cancelAnimationFrame(curRaf);
  curRaf = requestAnimationFrame(() => setCursor(y));
}
gwrap.addEventListener("pointermove", e => { if (e.pointerType === "mouse") cursorFromEvent(e); });
gwrap.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") cursorFromEvent(e); });
gwrap.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") setCursor(null); });

function tlZoom(f) {
  const mid = (gwrap.scrollLeft + gwrap.clientWidth / 2 - nameW()) / tl.ppy;

/* Nikoh holati matni: "1984–1992 · ajrashgan", "1948–1951 · Zebo vafot etgan", "1953-yildan" */
function marriageStatus(m) {
  const e = marriageEnd(m);
  if (!e) return `${m.year}-yildan`;
  if (e.type === "div") return `${m.year}–${e.year} · ajrashgan`;
  const other = get(e.who === m.a ? m.b : m.a);
  const remarried = marriagesOf(other.id).length > 1;
  return `${m.year}–${e.year}${remarried ? ` · ${get(e.who).name} vafot etgan` : ""}`;
}
function marriageNote(p, s) {
  const m = marriageOf(p.id, s.id);
  return `${s.blood ? "qarindosh · " : ""}${marriageStatus(m)}`;
}
/* Shaxsning barcha nikohlari va har biridan tug‘ilgan farzandlar */
function marriagesSection(p) {
  const ms = marriagesOf(p.id);
  if (!ms.length) return "";
  const multi = ms.length > 1;
  const blocks = ms.map((m, i) => {
    const s = partnerOf(m, p.id), kids = kidsOfMarriage(m), e = marriageEnd(m);
    let st = "";
    if (e && e.type === "div") st = `<span class="mst div">Ajrashgan · ${e.year}</span>`;
    else if (e && e.type === "death" && e.who === s.id && multi) st = `<span class="mst dead">${pick(p.sex, "Beva qolgan", "Beva qolgan")} · ${e.year}</span>`;
    else if (e && e.type === "death" && e.who === p.id) st = "";
    else if (!e) st = `<span class="mst now">Davom etmoqda</span>`;
    return `<div class="mar">
      <div class="marh">${multi ? `<span class="ord">${i + 1}</span>` : ""}${chip(s, s.blood ? "qarindosh" : "")}<span class="mwhen">${m.year}${e ? `–${e.year}` : "-yildan"}</span>${st}</div>
      ${kids.length ? `<div class="chips mkids">${kids.map(k => chip(k, String(k.b))).join("")}</div>` : `<div class="empty mkids">Bu nikohdan farzand qayd etilmagan.</div>`}
    </div>`;
  }).join("");
  const loose = p.blood ? allKids(p).filter(k => !ms.some(m => kidsOfMarriage(m).includes(k))) : [];
  return `<div class="sec"><h3>${multi ? `Nikohlari · ${ms.length}` : "Turmush o‘rtog‘i va farzandlari"}</h3><div class="mars">${blocks}</div>
    ${loose.length ? `<div class="chips" style="margin-top:8px">${loose.map(k => chip(k, String(k.b))).join("")}</div>` : ""}</div>`;
}
/* Turmush o‘rtog‘i ham shajaradan bo‘lsa: nikohdan oldingi qarindoshlikni tushuntiramiz */
function kinBox(p, s) {
  const m = marriageOf(p.id, s.id), r = lcaInfo(p, s);
  const t = bloodRel(s, p);
  return `<div class="kinbox">
    <b>${RINGS} Qarindoshlar nikohi · ${m.year}</b>
    <p>${esc(p.name)} va ${esc(s.name)} turmush qurishdan oldin ham qarindosh bo‘lgan: ${esc(s.name)} — ${esc(p.name)}ning ${esc(shortTerm(t))}${isLong(t) ? ` (aniq zanjir: ${esc(t)})` : ""}.
    Umumiy ajdodi — ${esc(full(r.lca))}: ${esc(p.name)} uning ${esc(descTerm(r.dA, p.sex))}, ${esc(s.name)} ham ${esc(descTerm(r.dB, s.sex))}.</p>

}
function showPerson(id) {
  const p = get(id);
  selected = id; relState = null; drawerMode = "person";
  const gen = `${ROMAN[p.depth]} avlod`;
  const pat = patronymic(p);
  let fam = "";

    if (p.parent) {

    ${galleryHtml(p)}

  openDrawer(p.blood ? "Shajara a’zosi" : (p.sex === "f" ? "Kelin" : "Kuyov"));

function uploadErrorText(err) {
  const c = err && err.code;
  if (c === "too_large") return "Rasm hajmi juda katta (20 MB dan oshmasin).";
  if (c === "unsupported_type") return "Bu fayl turini qo‘llab bo‘lmaydi. JPG, PNG yoki WEBP rasm tanlang.";
  if (c === "quota_or_state" || c === "quota_exceeded") return "Shajara uchun ajratilgan joy to‘lgan. Keraksiz rasmlarni o‘chirib, qayta urinib ko‘ring.";
  if (c === "rate_limited" || c === "resource_exhausted") return "Juda tez yuborildi. Bir necha soniyadan keyin qayta urinib ko‘ring.";
  if (c === "not_granted" || c === "capability_disabled") return "Bu ko‘rinishda rasm yuklash ruxsati yo‘q.";
  if (c === "upstream_auth") return "Kirish muddati tugagan. Sahifani yangilab, qayta kiring.";
  return "Rasm saqlanmadi. Internet aloqasini tekshirib, qayta urinib ko‘ring.";
}
/* Katta rasmlarni 1600 px gacha kichraytiramiz — joyni tejaydi va tez ochiladi */
async function shrink(file) {
  if (file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    return b || file;
  } catch (e) { return file; }
}
async function savePhoto(meta, file) {
  const blob = await shrink(file);
  if (caps.mode === "local") {
    uploaded.push({ ...meta, id: "local" + Date.now(), src: URL.createObjectURL(blob), local: true });
    refreshAll();
    return;
  }
  const r = await caps.assets.upload(blob, { type: blob.type || "image/jpeg" });
  await caps.db.collection("photos").add({ ...meta, asset: r.id, added: new Date().toISOString() });
}
async function deletePhoto(ph) {
  if (ph.local) { uploaded = uploaded.filter(x => x.id !== ph.id); refreshAll(); return; }
  await caps.db.doc("photos/" + ph.id).delete();
  try { await caps.assets.delete(ph.asset); } catch (e) { /* bazadagi yozuv o‘chdi; fayl keyin tozalanadi */ }
}

  for (const p of familyOrder(true)) (groups[p.depth] ||= []).push(p);
  return groups.map((g, d) => `<optgroup label="${ROMAN[d]} avlod">${g.map(p =>
    `<option value="${p.id}"${p.id === sel ? " selected" : ""}>${esc(full(p))}${p.blood ? ` (${p.b})` : ` — ${esc(host(p).name)}ning ${esc(spouseLabel(p, host(p)))}`}</option>`).join("")}</optgroup>`).join("");
}
const EXAMPLES = [["s_a3", "d5"], ["c8", "c6"], ["s_c9", "s_b8"], ["d6", "d9"], ["c10", "d6"], ["e4", "c6"],
  ["s_b1", "c13"], ["c13", "c1"], ["s_c2s", "d12"], ["s_c2", "d13"], ["s_a2", "b4"], ["b4", "b5"], ["s_b1z", "b1"], ["d7", "r"]];
function showRel(a, b) {
  a = a || "s_a3"; b = b || "d5";
  selected = null; drawerMode = "rel";
  dbody.innerHTML = `
    <div class="rel"><h2>Kim kimga kim?</h2><p class="lead">Ikki kishini tanlang — ular qanday qarindosh ekani va daraxtdagi bog‘lovchi yo‘l ko‘rsatiladi.</p></div>
    <div class="pick">
      <div class="col">
        <label for="ra">Birinchi kishi<select id="ra">${optionsHtml(a)}</select></label>
        <label for="rb">Ikkinchi kishi<select id="rb">${optionsHtml(b)}</select></label>
      </div>
      <button class="swap" id="rswap" aria-label="Almashtirish" title="Almashtirish">⇅</button>
    </div>
    <div id="rout"></div>
    <div class="sec"><h3>Misollar</h3><div class="examples">${EXAMPLES.map(([x, y]) =>
      `<button data-pair="${x},${y}">${esc(get(x).name)} ↔ ${esc(get(y).name)}</button>`).join("")}</div></div>`;
  openDrawer("Qarindoshlik");
  const ra = document.getElementById("ra"), rb = document.getElementById("rb");
  ra.onchange = rb.onchange = () => computeRel(ra.value, rb.value);
  document.getElementById("rswap").onclick = () => { const t = ra.value; ra.value = rb.value; rb.value = t; computeRel(ra.value, rb.value); };
  computeRel(a, b);
}
function computeRel(aId, bId) {
  const A = get(aId), B = get(bId), out = document.getElementById("rout");
  if (A === B) {
    out.innerHTML = `<div class="answer"><div class="big">Ikkala maydonda ham bir kishi tanlangan.</div></div>`;
    relState = null; render(); return;
  }
  const routes = relAll(A, B), back = relAll(B, A);
  relState = { a: aId, b: bId, ids: routes[0].ids, routes, active: 0 };
  const t1 = routes[0].term;
  const exact = isLong(t1) ? `<div class="rev">Aniq zanjir: ${esc(full(B))}ning ${esc(t1)}.</div>` : "";
  const multi = routes.length > 1
    ? `<div class="rev"><em>${routes.length} xil yo‘l bilan bog‘langan.</em> Pastda har birini alohida ko‘rish mumkin.</div>` : "";
  out.innerHTML = `<div class="answer">
      <div class="big">${esc(full(A))} — ${esc(full(B))}ning <em>${esc(termText(routes[0]))}</em>.</div>
      <div class="rev">Teskarisi: ${esc(full(B))} — ${esc(full(A))}ning <em>${esc(termText(back[0]))}</em>.</div>
      ${exact}${multi}
    </div>
    ${routes.length > 1 ? `<div class="sec"><h3>Barcha bog‘liqliklar</h3><div class="routes">${routes.map((r, i) =>
      `<button class="route${i === 0 ? " on" : ""}" data-route="${i}"><span class="kind ${r.kind}">${r.kind === "qon" ? "Qon bo‘yicha" : "Nikoh orqali"}</span><b>${esc(termText(r))}</b><small>${esc(routeNote(A, B, r))}</small></button>`).join("")}</div></div>` : ""}
    <div class="sec"><h3>Daraxtdagi yo‘l</h3><div class="path" id="rpath"></div><div class="rev" id="rlca" style="margin-top:8px"></div></div>`;
  if (view !== "tree") setView("tree");
  showRoute(0);
}
function routeNote(A, B, r) {
  if (r.kind === "nikoh" && r.via) return `${r.via.name} bilan nikoh orqali`;
  if (r.kind === "nikoh" && areSpouses(A.id, B.id)) return marriageStatus(marriageOf(A.id, B.id));
  if (r.lca) return `umumiy ajdod — ${full(r.lca)}`;
  return "";
}
function showRoute(i) {
  const A = get(relState.a), B = get(relState.b), r = relState.routes[i];
  relState.active = i; relState.ids = r.ids;
  document.querySelectorAll(".route").forEach((el, j) => el.classList.toggle("on", j === i));
  const ids = r.ids, lca = r.lca;
  const hA = host(A), hB = host(B);
  const startNote = !A.blood ? `<span>${esc(A.name)} ⚭</span>` : "";
  const endNote = !B.blood ? `<span>⚭ ${esc(B.name)}</span>` : "";
  let html = startNote;
  ids.forEach((id, k) => {
    if (k) html += `<span class="arrow">${areSpouses(ids[k - 1], id) ? "⚭" : "→"}</span>`;
    const p = get(id);
    html += `<button data-go="${id}" class="${lca && p === lca && lca !== hA && lca !== hB ? "lca" : ""}">${esc(p.name)}</button>`;
  });
  document.getElementById("rpath").innerHTML = html + endNote;
  document.getElementById("rlca").innerHTML = (r.route && lca !== hA && lca !== hB)
    ? `Umumiy ajdodi — <em>${esc(full(lca))}</em>: ${esc(hA.name)} uning ${esc(descTerm(r.route.dA, hA.sex))}, ${esc(hB.name)} esa ${esc(descTerm(r.route.dB, hB.sex))}.` : "";
  for (const id of ids) ensureExpanded(get(id));
  render();
  fitIds(ids, 700, 1);
}

/* ===== Ro‘yxat ko‘rinishi ===== */
function renderList() {
  const groups = [];
  (function walk(p) { (groups[p.depth] ||= []).push(p); p.kids.forEach(k => walk(get(k))); })(ROOT);
  const html = groups.map((g, d) => {
    let n = 0;
    const rows = g.map(p => {
      const ok = matches(p);
      if (ok) n++;
      const main = !ok ? "" : `<button class="lrow" data-go="${p.id}">${avatar(p)}<span class="nm">${esc(full(p))}</span><span class="sub">${esc(years(p))} · ${esc(p.job)}${p.parent ? ` · ${esc(patronymic(p))}` : ""}</span></button>`;
      const sp = p.spouses.map(get).filter(s => !s.blood && F.spouses && matches(s)).map(s => (n++, `<button class="lrow in" data-go="${s.id}">${avatar(s)}<span class="nm">${esc(s.name)}<span class="tag">${s.sex === "f" ? "kelin" : "kuyov"}</span></span><span class="sub">${esc(years(s))} · ${esc(p.name)}ning ${esc(spouseLabel(s, p))}</span></button>`)).join("");
      return main + sp;
    }).join("");
    if (!n) return "";
    return `<section class="lgen"><h2>${ROMAN[d]} avlod <small>${n} kishi · ${d3.min(g, p => p.b)}–${d3.max(g, p => p.b)} yillarda tug‘ilgan</small></h2><div class="lrows">${rows}</div></section>`;
  }).join("");
  document.getElementById("listin").innerHTML = html || `<div class="empty fempty">Tanlangan filtrlarga mos kishi topilmadi. <button class="btn sm" data-fclear="1">Filtrni tozalash</button></div>`;
}
function setView(v) {
  view = v;
  document.getElementById("vTree").setAttribute("aria-pressed", v === "tree");
  document.getElementById("vTime").setAttribute("aria-pressed", v === "time");
  document.getElementById("vList").setAttribute("aria-pressed", v === "list");
  document.getElementById("list").hidden = v !== "list";
  document.getElementById("timeline").hidden = v !== "time";
  stage.hidden = v !== "tree";
  document.getElementById("zoomCtl").hidden = v !== "tree";
  if (v !== "tree") hideHint();
  if (v === "list") renderList();
  if (v === "time") { renderTimeline(); markTimelineSel(); }
  if (v === "tree") render();
  if (drawerMode === "person" && selected) showPerson(selected);
}
document.getElementById("vTree").onclick = () => setView("tree");
document.getElementById("vTime").onclick = () => setView("time");
document.getElementById("vList").onclick = () => setView("list");
document.getElementById("openRel").onclick = () => showRel(relState?.a, relState?.b);

/* Rasmlar o‘zgarganda barcha ko‘rinishlarni yangilaymiz */
function refreshAll() {
  if (view === "tree") render();
  if (view === "time") { const sl = gwrap.scrollLeft, st = gwrap.scrollTop; renderTimeline(); gwrap.scrollLeft = sl; gwrap.scrollTop = st; markTimelineSel(); }
  if (view === "list") renderList();
  const gal = document.getElementById("gal");
  if (drawerMode === "person" && gal) {
    const tmp = document.createElement("div");
    tmp.innerHTML = galleryHtml(get(gal.dataset.person));
    gal.replaceWith(tmp.firstElementChild);
  }
  if (!lb.hidden) {
    const cur = lbs.list[lbs.i];
    lbs.list = lbs.ctx ? photosOf(lbs.ctx) : allPhotos();
    const i = cur ? lbs.list.findIndex(ph => ph.id === cur.id) : -1;
    if (i < 0) closeLightbox(); else { lbs.i = i; drawLightbox(); }
  }
}

/* ===== Qidiruv ===== */
const q = document.getElementById("q"), qres = document.getElementById("qres");
const norm = s => s.toLowerCase().replace(/[‘’ʻʼ'`]/g, "'");
let qIdx = 0, qItems = [];
function runSearch() {
  const s = norm(q.value.trim());
  if (!s) { qres.hidden = true; return; }
  qItems = [...byId.values()].filter(p => norm(full(p)).includes(s) || norm(p.job).includes(s) || norm(p.place).includes(s)).slice(0, 12);
  qIdx = 0;
  qres.innerHTML = qItems.length ? qItems.map((p, i) =>
    `<li><button data-go="${p.id}" class="${i === 0 ? "on" : ""}"><span>${esc(full(p))}</span><small>${ROMAN[p.depth]} avlod · ${esc(years(p))} · ${esc(p.job)}</small></button></li>`).join("")
    : `<li class="empty" style="padding:10px">Hech kim topilmadi. Ismni boshqacha yozib ko‘ring.</li>`;
  qres.hidden = false;
}
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && qItems[qIdx]) { go(qItems[qIdx].id); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    qIdx = (qIdx + (e.key === "ArrowDown" ? 1 : -1) + qItems.length) % qItems.length;
    qres.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === qIdx));
  }
  if (e.key === "Escape") { qres.hidden = true; q.blur(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) qres.hidden = true; });

/* ===== Hodisalar ===== */
function go(id) {
  qres.hidden = true; q.value = "";
  showPerson(id);
  if (view === "tree") focusPerson(id);
  if (view === "time") {
    const row = gwrap.querySelector(`.grow[data-go="${id}"]`);
    if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-route],[data-relpair],[data-photo],[data-upload],[data-back],[data-open],[data-go],[data-tg],[data-relfrom],[data-pair],[data-totree]");
  if (!t) return;
  if (t.dataset.route) {
    showRoute(+t.dataset.route);
  } else if (t.dataset.relpair) {
    const [a, b] = t.dataset.relpair.split(",");
    showRel(a, b);
  } else if (t.dataset.photo) {
    openPhoto(t.dataset.photo, t.dataset.ctx);
  } else if (t.dataset.upload) {
    showUpload(t.dataset.upload);
  } else if (t.dataset.back) {
    showPerson(t.dataset.back);
  } else if (t.dataset.open) {
    const id = t.dataset.open;
    showPerson(id);
    if (!isVisible(id)) focusPerson(id, { flash: false, keepZoom: true });
  } else if (t.dataset.go) {
    if (t.dataset.lbclose) closeLightbox();
    go(t.dataset.go);
  } else if (t.dataset.tg) {
    const id = t.dataset.tg;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    render();
  } else if (t.dataset.relfrom) {
    const a = t.dataset.relfrom;
    showRel(a, a === "r" ? "d7" : "r");
  } else if (t.dataset.pair) {
    const [a, b] = t.dataset.pair.split(",");
    document.getElementById("ra").value = a; document.getElementById("rb").value = b;
    computeRel(a, b);
  } else if (t.dataset.totree) {
    setView("tree"); focusPerson(t.dataset.totree);
  }
});
document.addEventListener("keydown", e => {
  if (!lb.hidden) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") stepLightbox(-1);
    if (e.key === "ArrowRight") stepLightbox(1);
    return;
  }
  if (e.key === "Escape" && !fpanel.hidden) { closeFilters(); return; }
  if (e.key === "Escape" && !drawer.hidden && document.activeElement !== q) closeDrawer();
});

/* ===== Boshlash ===== */
render();
/* Boshida: I–III avlodlar ko‘rinadigan qilib, shajara boshini markazga qo‘yamiz */
function initialView() {
  const w = stage.clientWidth;
  if (!w) return;
  const top3 = [...byId.values()].filter(p => p.blood && p.depth <= 2).map(p => layout.get(p.id)).filter(Boolean);
  const bw = d3.max(top3, p => p.x) - d3.min(top3, p => p.x) + CW;
  const k = Math.max(isNarrow() ? 0.6 : 0.5, Math.min(1, (w - 140) / bw));
  const cx = (d3.min(top3, p => p.x) + d3.max(top3, p => p.x)) / 2;
  d3.select(stage).call(zoom.transform, d3.zoomIdentity.translate(w / 2 - cx * k, 40).scale(k));
}
let userMoved = false;
stage.addEventListener("pointerdown", () => { userMoved = true; });
stage.addEventListener("wheel", () => { userMoved = true; }, { passive: true });
initialView();
requestAnimationFrame(initialView);
let lastNarrow = isNarrow();
window.addEventListener("resize", () => {
  if (view === "time" && isNarrow() !== lastNarrow) { tl.ppy = 0; renderTimeline(); markTimelineSel(); }
  lastNarrow = isNarrow();
  if (view === "tree" && !userMoved && drawer.hidden) initialView();
  else updateRail(d3.zoomTransform(stage));
});
initCaps();

/* ===== To‘liq ekran =====
   Brauzer qo‘llasa tugma ko‘rinadi (iPhone Safari sahifani to‘liq ekranga chiqarmaydi). F tugmasi ham ishlaydi, Esc — chiqish. */
const fsBtn = document.getElementById("fsBtn");
const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
fsBtn.hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
async function toggleFullscreen() {
  const root = document.documentElement;
  try {
    if (fsActive()) await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
    else await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen());
  } catch (e) { /* brauzer rad etdi — sahifa odatdagidek ishlashda davom etadi */ }
}
function syncFullscreen() {
  const on = fsActive();
  fsBtn.setAttribute("aria-pressed", on);
  fsBtn.title = on ? "To‘liq ekrandan chiqish (F yoki Esc)" : "To‘liq ekran (F)";
  fsBtn.setAttribute("aria-label", on ? "To‘liq ekrandan chiqish" : "To‘liq ekran");
}
fsBtn.onclick = toggleFullscreen;
document.addEventListener("fullscreenchange", syncFullscreen);
document.addEventListener("webkitfullscreenchange", syncFullscreen);
document.addEventListener("keydown", e => {
  if (fsBtn.hidden || e.repeat || e.metaKey || e.ctrlKey || e.altKey || (e.key !== "f" && e.key !== "F")) return;
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  e.preventDefault();
  toggleFullscreen();
});
</script>
